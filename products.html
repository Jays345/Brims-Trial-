<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | BRIMS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>
:root {
  --bg: #0f172a;
  --sidebar: #1e293b;
  --card: #1e293b;
  --text: #f1f5f9;
  --accent: #3b82f6;
  --success: #22c55e;
  --danger: #ef4444;
}
:root[data-theme='light'] {
  --bg: #f8fafc;
  --sidebar: #e2e8f0;
  --card: #ffffff;
  --text: #1e293b;
  --accent: #3b82f6;
  --success: #16a34a;
  --danger: #ef4444;
}
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  display: flex;
  transition: all 0.3s;
}

.logo {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.logo img {
  width: 50px;
  height: 50px;
  object-fit: contain;
  border-radius: 10px;
}


.sidebar {
  width: 220px;
  background: var(--sidebar);
  color: var(--text);
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  padding-top: 20px;
  transition: width 0.3s ease;
  overflow: hidden;
}

.sidebar ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.sidebar ul li {
  margin: 10px 0;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  color: var(--text);
  text-decoration: none;
  transition: background 0.3s;
  white-space: nowrap;
}

.sidebar a:hover {
  background: var(--accent);
  color: #fff;
}

.sidebar.collapsed {
  width: 70px;
}

.sidebar.collapsed h2 {
  display: none;
}

.sidebar.collapsed a {
  justify-content: center;
  padding: 10px;
}

.sidebar.collapsed a span {
  display: none; /* hides the text but keeps icons visible */
}

.sidebar.collapsed a i {
  font-size: 18px;
}

/* Adjust main content when sidebar collapses */
.main-content {
  margin-left: 220px;
  transition: margin-left 0.3s ease;
}

.sidebar.collapsed + .main-content {
  margin-left: 70px;
}


/* ===== MAIN CONTENT ===== */
.main-content {
  margin-left: 220px;
  padding: 20px;
  flex: 1;
  transition: margin-left 0.3s;
}
.sidebar.collapsed + .main-content {
  margin-left: 60px;
}

/* ===== HEADER & BUTTONS ===== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
header h1 {
  margin: 0;
}

.top-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  font-weight: 500;
  transition: background 0.3s ease;
}
.btn:hover {
  background: #2563eb;
}
.logout-btn {
  padding: 8px 14px;
  border-radius: 6px;
  background: var(--danger);
  color: #fff;
  text-decoration: none;
  font-weight: 500;
  transition: background 0.3s ease;
}
.logout-btn:hover {
  background: #c72c35;
}

/* ===== ACTION BAR ===== */
.action-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
.action-bar input, .action-bar select, .modal-content input, .modal-content select {
  padding: 8px;
  border-radius: 5px;
  border: none;
  background: #2a2a2a;
  color: #fff;
}
.action-bar button {
  padding: 8px 14px;
  border-radius: 6px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: background 0.3s ease;
}
.action-bar button:hover {
  background: #2563eb;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  background: var(--card);
  border-radius: 10px;
  overflow: hidden;
}
th, td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid #334155;
}
th {
  background: var(--sidebar);
  position: sticky;
  top: 0;
}
tr:hover {
  background: var(--accent);
  color: #fff;
}
.low-stock {
  color: var(--danger);
  font-weight: bold;
}
.sufficient-stock {
  color: var(--success);
}
.checkbox-col {
  width: 30px;
  text-align: center;
}

/* ===== MODAL ===== */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.6);
  justify-content: center;
  align-items: center;
  z-index: 999;
}
.modal-content {
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
  width: 400px;
  max-width: 90%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modal-content button {
  padding: 10px;
  border: none;
  border-radius: 5px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.modal-content button:hover {
  background: #2563eb;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #333;
  color: #fff;
  padding: 12px 20px;
  border-radius: 8px;
  opacity: 0;
  transition: 0.3s;
  z-index: 1000;
}
.toast.show {
  opacity: 1;
}

/* ===== PAGINATION ===== */
.pagination {
  display: flex;
  gap: 5px;
  justify-content: center;
  margin-top: 15px;
}
.pagination button {
  padding: 6px 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  background: #2a2a2a;
  color: #fff;
}
.pagination button.active {
  background: var(--accent);
  color: #fff;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .main-content { margin-left: 0; padding: 10px; }
  .sidebar { display: none; }
  header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .top-controls { justify-content: flex-start; width: 100%; }
  .action-bar { flex-direction: column; align-items: stretch; }
}
</style>
</head>

<body>
   <div class="sidebar" id="sidebar">
  <div class="logo">
    <img src="https://cdn-icons-png.flaticon.com/512/1828/1828673.png" alt="logo" />
  </div>

  <ul>
        <li><a href="index.html"> <span>Dashboard</span></a></li>
        <li><a href="products.html"> <span>Inventory</span></a></li>
        <li><a href="suppliers.html"> <span>Suppliers</span></a></li>
        <li><a href="orders.html"> <span>Orders</span></a></li>
        <li><a href="reports.html"> <span>Reports</span></a></li>
        <li><a href="budgets.html"> <span>Budget</span></a></li>
        <li><a href="request.html"> <span>Help</span></a></li>
        <li><a href="chat.html"> <span>Chatbot</span></a></li>
        <li><a href="settings.html"> <span>Settings</span></a></li>

  </ul>
</div>



  <!-- MAIN CONTENT -->
  <div class="main-content">
    <header>
      <h1>Inventory</h1>
      <div class="top-controls">
        <button id="sidebarToggle" class="btn">☰</button>
        <button id="themeToggle" class="btn">🌙 Dark Mode</button>
      </div>
    </header>

    <div class="action-bar">
          <button id="addProductBtn"> Add Product</button>
          <button id="deleteSelectedBtn"> Delete Selected</button>
          <button id="exportBtn" class="btn"> Export CSV</button>
          <input type="text" id="searchInput" placeholder="Search products...">
          <select id="categoryFilter"><option value="">All Categories</option></select>
          <select id="supplierFilter"><option value="">All Suppliers</option></select>
          <select id="stockFilter">
            <option value="">All Stock</option>
            <option value="low">Low (&lt;10)</option>
            <option value="sufficient">Sufficient (&gt;=10)</option>
      </select>
    </div>

    <div id="loading">Loading...</div>
    <div id="noProducts">No products found.</div>

    <table id="productsTable">
      <thead>
        <tr>
          <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
          <th data-sort="sku">SKU</th>
          <th data-sort="product_name">Product Name</th>
          <th data-sort="category_name">Category</th>
          <th data-sort="supplier_name">Supplier</th>
          <th data-sort="cost_price">Cost Price</th>
          <th data-sort="selling_price">Selling Price</th>
          <th data-sort="stock_quantity">Stock</th>
          <th data-sort="created_at">Created At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Product</h3>
      <input type="hidden" id="productId">
      <input type="text" id="productName" placeholder="Product Name">
      <input type="text" id="productSKU" placeholder="SKU">
      <select id="productCategory"></select>
      <select id="productSupplier"></select>
      <input type="number" id="productCost" placeholder="Cost Price">
      <input type="number" id="productSelling" placeholder="Selling Price">
      <input type="number" id="productStock" placeholder="Stock Quantity">
      <button id="saveProductBtn">Save</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

 <script>
// --- Sidebar toggle ---
const sidebar = document.getElementById('sidebar');
document.getElementById('sidebarToggle').addEventListener('click',()=>{
  sidebar.classList.toggle('collapsed');
  document.querySelector('.main-content').style.marginLeft = sidebar.classList.contains('collapsed') ? '60px' : '220px';
});

// --- Light/Dark toggle ---
const themeBtn = document.getElementById('themeToggle');
const root = document.documentElement;
if(localStorage.getItem('theme')==='light'){root.setAttribute('data-theme','light'); themeBtn.textContent='🌙 Dark Mode';}
themeBtn.addEventListener('click',()=>{
  if(root.getAttribute('data-theme')==='light'){
    root.removeAttribute('data-theme'); themeBtn.textContent='☀️ Light Mode'; localStorage.setItem('theme','dark');
  }else{
    root.setAttribute('data-theme','light'); themeBtn.textContent='🌙 Dark Mode'; localStorage.setItem('theme','light');
  }
});
const productsTable = document.querySelector('#productsTable tbody');
const productModal = document.getElementById('productModal');
const modalTitle = document.getElementById('modalTitle');
const productIdInput = document.getElementById('productId');
const productNameInput = document.getElementById('productName');
const productSKUInput = document.getElementById('productSKU');
const productCategorySelect = document.getElementById('productCategory');
const productSupplierSelect = document.getElementById('productSupplier');
const productCostInput = document.getElementById('productCost');
const productSellingInput = document.getElementById('productSelling');
const productStockInput = document.getElementById('productStock');
const searchInput = document.getElementById('searchInput');
const categoryFilter = document.getElementById('categoryFilter');
const supplierFilter = document.getElementById('supplierFilter');
const stockFilter = document.getElementById('stockFilter');
const loadingDiv = document.getElementById('loading');
const noProductsDiv = document.getElementById('noProducts');
const toastDiv = document.getElementById('toast');
const paginationDiv = document.getElementById('pagination');
const selectAllCheckbox = document.getElementById('selectAll');
const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
const exportBtn = document.getElementById('exportBtn');

let products = [];
let currentPage = 1;
const pageSize = 10;
let currentSort = {column:'sku', dir:'asc'};

// --- Toast Notification ---
function showToast(message, duration=3000){
  toastDiv.textContent = message;
  toastDiv.classList.add('show');
  setTimeout(()=> toastDiv.classList.remove('show'), duration);
}

// --- Modal ---
document.getElementById('addProductBtn').addEventListener('click', ()=>{
  modalTitle.textContent='Add Product';
  productIdInput.value='';
  productNameInput.value='';
  productSKUInput.value='';
  productCategorySelect.value='';
  productSupplierSelect.value='';
  productCostInput.value='';
  productSellingInput.value='';
  productStockInput.value='';
  productModal.style.display='flex';
});
productModal.addEventListener('click', e=>{ if(e.target===productModal) productModal.style.display='none'; });

// --- Load dropdowns ---
async function loadDropdowns() {
  try {
    // ----- Load categories -----
    const categoryRes = await fetch('api/get_categories.php');
    const catData = await categoryRes.json();
    const cats = catData.categories || catData;  // Supports both formats

    productCategorySelect.innerHTML = cats
      .map(c => `<option value="${c.category_id}">${c.category_name}</option>`)
      .join('');

    categoryFilter.innerHTML =
      `<option value="">All Categories</option>` +
      cats.map(c =>
        `<option value="${c.category_id}">${c.category_name}</option>`
      ).join('');

    // ----- Load suppliers -----
    const supplierRes = await fetch('api/get_suppliers.php');
    const supData = await supplierRes.json();
    const sups = supData.suppliers || supData; // your new PHP returns "suppliers" key

    productSupplierSelect.innerHTML = sups
      .map(s => `<option value="${s.supplier_id}">${s.supplier_name}</option>`)
      .join('');

    supplierFilter.innerHTML =
      `<option value="">All Suppliers</option>` +
      sups.map(s =>
        `<option value="${s.supplier_id}">${s.supplier_name}</option>`
      ).join('');

  } catch (err) {
    console.error(err);
    showToast('Failed to load dropdowns');
  }
}


// --- Load products ---
async function loadProducts(){
  loadingDiv.style.display='block';
  noProductsDiv.style.display='none';
  productsTable.innerHTML='';
  const params = new URLSearchParams({
    search: searchInput.value,
    category: categoryFilter.value,
    supplier: supplierFilter.value,
    stock: stockFilter.value
  });
  try{
    const res = await fetch(`api/get_products.php?${params}`);
    const data = await res.json();
    products = data.products || [];
    loadingDiv.style.display='none';
    if(products.length===0){ noProductsDiv.style.display='block'; return; }
    renderTable();
    renderPagination();
  }catch(err){
    loadingDiv.style.display='none';
    noProductsDiv.style.display='block';
    noProductsDiv.textContent='Failed to load products.';
    console.error(err);
  }
}

// --- Render Table ---
function renderTable(){
  productsTable.innerHTML='';
  const sorted = [...products].sort((a,b)=>{
    if(a[currentSort.column]<b[currentSort.column]) return currentSort.dir==='asc'? -1:1;
    if(a[currentSort.column]>b[currentSort.column]) return currentSort.dir==='asc'? 1:-1;
    return 0;
  });
  const start = (currentPage-1)*pageSize;
  const pageItems = sorted.slice(start,start+pageSize);

  pageItems.forEach(p=>{
    const tr = document.createElement('tr');
    tr.innerHTML=`
      <td class="checkbox-col"><input type="checkbox" class="row-checkbox" data-id="${p.product_id}"></td>
      <td>${highlight(p.sku)}</td>
      <td>${highlight(p.product_name)}</td>
      <td>${p.category_name}</td>
      <td>${p.supplier_name}</td>
      <td>${p.cost_price}</td>
      <td>${p.selling_price}</td>
      <td class="${p.stock_quantity<10?'low-stock':'sufficient-stock'}">${p.stock_quantity}</td>
      <td>${p.created_at}</td>
      <td>
        <button class="edit-btn" data-id="${p.product_id}">Edit</button>
        <button class="delete-btn" data-id="${p.product_id}">Delete</button>
      </td>
    `;
    productsTable.appendChild(tr);
  });

  document.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const p = await (await fetch(`api/get_product.php?id=${id}`)).json();
      modalTitle.textContent='Edit Product';
      productIdInput.value=p.product_id;
      productNameInput.value=p.product_name;
      productSKUInput.value=p.sku;
      productCategorySelect.value=p.category_id;
      productSupplierSelect.value=p.supplier_id;
      productCostInput.value=p.cost_price;
      productSellingInput.value=p.selling_price;
      productStockInput.value=p.stock_quantity;
      productModal.style.display='flex';
    });
  });

  document.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(confirm('Are you sure?')){
        await fetch(`api/delete_product.php?id=${btn.dataset.id}`,{method:'DELETE'});
        showToast('Product deleted');
        loadProducts();
      }
    });
  });
}

// --- Highlight search ---
function highlight(text){
  const query = searchInput.value.trim();
  if(!query) return text;
  const regex = new RegExp(`(${query})`,'gi');
  return text.replace(regex,'<mark>$1</mark>');
}

// --- Save Product ---
document.getElementById('saveProductBtn').addEventListener('click', async ()=>{
  const data = {
    product_id: productIdInput.value,
    product_name: productNameInput.value,
    sku: productSKUInput.value,
    category_id: productCategorySelect.value,
    supplier_id: productSupplierSelect.value,
    cost_price: productCostInput.value,
    selling_price: productSellingInput.value,
    stock_quantity: productStockInput.value
  };
  try{
    const url = data.product_id ? `api/update_product.php?id=${data.product_id}`:'api/add_product.php';
    await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    productModal.style.display='none';
    showToast(data.product_id?'Product updated':'Product added');
    loadProducts();
  }catch(err){ console.error(err); showToast('Failed to save product'); }
});

// --- Filters & Search ---
[searchInput, categoryFilter, supplierFilter, stockFilter].forEach(el=> el.addEventListener('input', ()=>{currentPage=1; loadProducts();}));

// --- Pagination ---
function renderPagination(){
  paginationDiv.innerHTML='';
  const totalPages = Math.ceil(products.length/pageSize);
  for(let i=1;i<=totalPages;i++){
    const btn = document.createElement('button');
    btn.textContent=i;
    if(i===currentPage) btn.classList.add('active');
    btn.addEventListener('click',()=>{ currentPage=i; renderTable(); renderPagination(); });
    paginationDiv.appendChild(btn);
  }
}

// --- Column Sorting ---
document.querySelectorAll('th[data-sort]').forEach(th=>{
  th.addEventListener('click',()=>{
    const col = th.dataset.sort;
    currentSort.dir = currentSort.column===col && currentSort.dir==='asc'? 'desc':'asc';
    currentSort.column=col;
    renderTable();
    renderPagination();
  });
});

// --- Select All & Bulk Delete ---
selectAllCheckbox.addEventListener('change', ()=>{
  document.querySelectorAll('.row-checkbox').forEach(cb=> cb.checked=selectAllCheckbox.checked);
});
deleteSelectedBtn.addEventListener('click', async ()=>{
  const selected = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb=>cb.dataset.id);
  if(selected.length===0) return showToast('No products selected');
  if(confirm(`Delete ${selected.length} products?`)){
    await Promise.all(selected.map(id=>fetch(`api/delete_product.php?id=${id}`,{method:'DELETE'})));
    showToast('Selected products deleted');
    loadProducts();
  }
});

// --- Export CSV ---
exportBtn.addEventListener('click', ()=>{
  if(products.length===0) return showToast('No products to export');
  let csv='SKU,Product Name,Category,Supplier,Cost,Selling,Stock,Created At\n';
  products.forEach(p=> csv+=`${p.sku},${p.product_name},${p.category_name},${p.supplier_name},${p.cost_price},${p.selling_price},${p.stock_quantity},${p.created_at}\n`);
  const blob = new Blob([csv],{type:'text/csv'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download='products.csv';
  link.click();
});

// --- Initialize ---
loadDropdowns().then(loadProducts);
</script>
</body>
</html>
