<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | BRIMS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a; --sidebar:#1e293b; --card:#1e293b; --text:#f1f5f9;
  --accent:#3b82f6; --success:#22c55e; --danger:#ef4444;
}
:root[data-theme='light']{
  --bg:#f8fafc; --sidebar:#e2e8f0; --card:#ffffff; --text:#1e293b;
  --accent:#2563eb; --success:#16a34a; --danger:#ef4444;
}
*{transition:background 0.3s,color 0.3s,border-color 0.3s;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;transition:all 0.3s;}
.logo {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.logo img {
  width: 50px;
  height: 50px;
  object-fit: contain;
  border-radius: 10px;
}

.sidebar{width:220px;position:fixed;height:100%;background:var(--sidebar);padding-top:20px;}
.sidebar h2{text-align:center;margin-bottom:20px;}
.sidebar ul{list-style:none;padding:0;}
.sidebar li{margin:10px 0;}
.sidebar a{color:var(--text);text-decoration:none;padding:10px 20px;display:block;border-radius:6px;}
.sidebar a:hover,.sidebar a.active{background:var(--accent);color:#fff;}
.main-content{margin-left:220px;padding:20px;flex:1;transition:margin-left 0.3s;}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px;}
header h1{margin:0;}
.theme-toggle{cursor:pointer;font-size:1.4rem;background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;transition:background 0.3s;}
.theme-toggle:hover{background:#1d4ed8;}
.filter-bar, .kpi-cards{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.kpi-card{flex:1;padding:15px;border-radius:10px;background:var(--card);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.kpi-card h3{margin:0;font-size:1.2rem;}
.kpi-card p{font-size:1.5rem;font-weight:bold;margin:5px 0 0;}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.1);}
th,td{padding:12px;text-align:left;border-bottom:1px solid #334155;}
:root[data-theme='light'] th, :root[data-theme='light'] td {border-color:#cbd5e1;}
th{background:var(--sidebar);position:sticky;top:0;}
tr:hover{background:var(--accent);color:#fff;}
.status-badge{padding:3px 8px;border-radius:5px;color:#fff;font-weight:500;}
.status-pending{background:#f59e0b;}
.status-processing{background:#3b82f6;}
.status-shipped{background:#0ea5e9;}
.status-delivered{background:var(--success);}
.status-cancelled{background:var(--danger);}
button{padding:5px 10px;border:none;border-radius:5px;cursor:pointer;background:var(--accent);color:#fff;transition:background 0.3s;}
button:hover{background:#2563eb;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;}
.modal-content{background:var(--card);padding:20px;border-radius:12px;width:400px;max-width:90%;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
.modal-content input, .modal-content select{padding:8px;border-radius:5px;border:1px solid #475569;background:transparent;color:var(--text);}
.modal-content button:hover{background:#1d4ed8;}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="logo">
    <img src="https://cdn-icons-png.flaticon.com/512/1828/1828673.png" alt="logo" />
  </div>

      <ul>
            <li><a href="index.html"> <span>Dashboard</span></a></li>
            <li><a href="products.html"> <span>Inventory</span></a></li>
            <li><a href="suppliers.html"> <span>Suppliers</span></a></li>
            <li><a href="orders.html"> <span>Orders</span></a></li>
            <li><a href="reports.html"> <span>Reports</span></a></li>
            <li><a href="budgets.html"> <span>Budget</span></a></li>
            <li><a href="request.html"> <span>Help</span></a></li>
            <li><a href="chat.html"> <span>Chatbot</span></a></li>
            <li><a href="settings.html"> <span>Settings</span></a></li>

      </ul>

</div>


<div class="main-content">
  <header>
    <h1>Orders</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
  </header>

  <!-- KPI Cards -->
  <div class="kpi-cards">
    <div class="kpi-card"><h3>Total Orders</h3><p id="totalOrders">0</p></div>
    <div class="kpi-card"><h3>Pending</h3><p id="pendingOrders">0</p></div>
    <div class="kpi-card"><h3>Delivered</h3><p id="deliveredOrders">0</p></div>
    <div class="kpi-card"><h3>Cancelled</h3><p id="cancelledOrders">0</p></div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search customer/product">
    <select id="statusFilter">
      <option value="all">All Statuses</option>
      <option value="pending">Pending</option>
      <option value="processing">Processing</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <input type="date" id="fromDate">
    <input type="date" id="toDate">
    <button onclick="loadOrders()">Filter</button>
  </div>

  <!-- Orders Table -->
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Order ID</th>
        <th>Customer</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Total Price</th>
        <th>Status</th>
        <th>Order Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="ordersTable"></tbody>
  </table>
</div>

<!-- Edit Modal -->
<div class="modal" id="orderModal">
  <div class="modal-content">
    <h3>Edit Order</h3>
    <input type="hidden" id="modalOrderId">
    <input type="text" id="modalCustomer" placeholder="Customer Name" disabled>
    <input type="text" id="modalProduct" placeholder="Product Name" disabled>
    <input type="number" id="modalQty" placeholder="Quantity">
    <input type="number" id="modalTotal" placeholder="Total Price">
    <select id="modalStatus">
      <option value="pending">Pending</option>
      <option value="processing">Processing</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <button onclick="saveOrder()">Save</button>
    <button onclick="deleteOrder()">Delete</button>
  </div>
</div>

<script>
// --- Theme toggle
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  if (currentTheme === 'light') {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙';
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    themeToggle.textContent = '☀️';
    localStorage.setItem('theme', 'light');
  }
});

// --- Load saved theme
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    themeToggle.textContent = '☀️';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙';
  }
});

// --- Toast
function showToast(msg){ alert(msg); }

// --- Load orders
async function loadOrders(){
  const tbody = document.getElementById('ordersTable');
  tbody.innerHTML='';
  const status = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchInput').value;
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;

  const params = new URLSearchParams({status,search,from,to});
  const res = await fetch('api/get_order.php?'+params);
  const data = await res.json();
  if(!data.success){ showToast('Failed to load orders'); return; }
  const orders = data.orders;

  orders.forEach(o=>{
    const tr = document.createElement('tr');
    tr.innerHTML=`
      <td><input type="checkbox" class="row-checkbox"></td>
      <td>${o.id}</td>
      <td>${o.customer}</td>
      <td>${o.product}</td>
      <td>${o.qty}</td>
      <td>${o.total}</td>
      <td><span class="status-badge status-${o.status}">${o.status}</span></td>
      <td>${o.date}</td>
      <td><button onclick='openOrderModal(${JSON.stringify(o)})'>View/Edit</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('totalOrders').textContent = orders.length;
  document.getElementById('pendingOrders').textContent = orders.filter(o=>o.status==='pending').length;
  document.getElementById('deliveredOrders').textContent = orders.filter(o=>o.status==='delivered').length;
  document.getElementById('cancelledOrders').textContent = orders.filter(o=>o.status==='cancelled').length;
}

// --- Modal
function openOrderModal(order){
  const modal = document.getElementById('orderModal');
  modal.style.display='flex';
  document.getElementById('modalOrderId').value=order.id;
  document.getElementById('modalCustomer').value=order.customer;
  document.getElementById('modalProduct').value=order.product;
  document.getElementById('modalQty').value=order.qty;
  document.getElementById('modalTotal').value=order.total;
  document.getElementById('modalStatus').value=order.status;
}

// --- Save order
async function saveOrder(){
  const data={
    id: document.getElementById('modalOrderId').value,
    quantity: document.getElementById('modalQty').value,
    total: document.getElementById('modalTotal').value,
    status: document.getElementById('modalStatus').value
  };
  await fetch('api/update_order.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  document.getElementById('orderModal').style.display='none';
  loadOrders();
}

// --- Delete order
async function deleteOrder(){
  const id = document.getElementById('modalOrderId').value;
  if(confirm('Delete this order?')){
    await fetch('api/delete_order.php?id='+id);
    document.getElementById('orderModal').style.display='none';
    loadOrders();
  }
}

window.onload = loadOrders;
document.getElementById('orderModal').addEventListener('click', e=>{ if(e.target==document.getElementById('orderModal')) e.target.style.display='none'; });
</script>

</body>
</html>
