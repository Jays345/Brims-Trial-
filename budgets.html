<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgets | BRIMS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    /* Primary theme colors */
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --accent: #22c55e;
    --danger: #ef4444;
    --text-dark: #f8fafc;
    --text-light: #1f2937;
    --card-bg-dark: rgba(30,41,59,0.8);
    --card-bg-light: rgba(255,255,255,0.85);
    --shadow: rgba(0, 0, 0, 0.25);
    --glass-border: rgba(255, 255, 255, 0.1);
    --bg-gradient-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --bg-gradient-light: linear-gradient(135deg, #f9fafb 0%, #e2e8f0 100%);
  }

  body {
    font-family: 'Inter', 'Poppins', sans-serif;
    background: var(--bg-gradient-dark);
    color: var(--text-dark);
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    transition: all 0.5s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    background: linear-gradient(90deg, #3b82f6, #22c55e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: fadeIn 1s ease;
  }

  /* Control Panel */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 25px;
    animation: fadeUp 1s ease;
  }

  button, select {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 10px var(--shadow);
    transition: all 0.3s ease;
    letter-spacing: 0.4px;
  }

  button:hover, select:hover {
    background: var(--primary-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(59,130,246,0.3);
  }

  select {
    background: var(--accent);
  }

  /* Table Styling */
  table {
    width: 95%;
    border-collapse: collapse;
    margin-top: 25px;
    border-radius: 15px;
    overflow: hidden;
    background: var(--card-bg-dark);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px var(--shadow);
    animation: fadeIn 1.2s ease;
  }

  th, td {
    padding: 14px;
    text-align: center;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--glass-border);
  }

  th {
    background: var(--primary);
    color: #fff;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  tbody tr {
    transition: background 0.3s ease, transform 0.2s ease;
  }

  tbody tr:hover {
    background: rgba(59,130,246,0.15);
    transform: scale(1.01);
  }

  tbody tr:nth-child(even) {
    background: rgba(255,255,255,0.03);
  }

  input {
    width: 90%;
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    text-align: center;
    background: rgba(15,23,42,0.8);
    color: var(--text-dark);
    font-size: 0.9rem;
    transition: all 0.3s ease;
  }

  input:focus {
    outline: 2px solid var(--primary);
    background: rgba(30,58,138,0.6);
    box-shadow: 0 0 8px rgba(37,99,235,0.5);
  }

  tfoot td {
    background: rgba(30,41,59,0.95);
    font-weight: 700;
    color: var(--accent);
    border-top: 2px solid var(--primary);
  }

  /* Chart */
  canvas {
    width: 90%;
    margin-top: 40px;
    border-radius: 20px;
    background: var(--card-bg-dark);
    backdrop-filter: blur(10px);
    padding: 20px;
    box-shadow: 0 6px 18px var(--shadow);
    animation: fadeUp 1.3s ease;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: rgba(15,23,42,0.9);
    color: #fff;
    padding: 14px 22px;
    border-radius: 10px;
    box-shadow: 0 4px 12px var(--shadow);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Light Mode */
  body.light {
    background: var(--bg-gradient-light);
    color: var(--text-light);
  }

  body.light table {
    background: var(--card-bg-light);
  }

  body.light th {
    background: var(--primary-hover);
  }

  body.light canvas {
    background: var(--card-bg-light);
  }

  body.light .toast {
    background: rgba(255,255,255,0.9);
    color: #1f2937;
  }

  /* Animations */
  @keyframes fadeIn {
    0% {opacity: 0; transform: translateY(-10px);}
    100% {opacity: 1; transform: translateY(0);}
  }

  @keyframes fadeUp {
    0% {opacity: 0; transform: translateY(20px);}
    100% {opacity: 1; transform: translateY(0);}
  }

  /* Buttons glow on focus */
  button:focus-visible {
    outline: 2px solid var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
</style>
</head>

<body>
<h1>Operating Expenses Budget</h1>

<div class="controls">
  <button onclick="goHome()"> Home</button>
  <button onclick="addRow()"> Add Row</button>
  <button onclick="saveBudget()"> Save Budget</button>
  <button onclick="printTable()"> Print Table</button>
  <button onclick="exportExcel()"> Export Excel</button>
  <button onclick="toggleTheme()">🌙 / ☀️ Toggle Theme</button>
  <select id="presetTemplates" onchange="loadTemplate()">
    <option value=""> Load Template</option>
    <option value="basic">Basic Expenses</option>
    <option value="marketing">Marketing Budget</option>
    <option value="full">Full Department Budget</option>
  </select>
</div>

<table id="budgetTable">
  <thead>
    <tr>
      <th>Category</th>
      <th>Approved Budget ($)</th>
      <th>Proposed Budget ($)</th>
      <th>Difference ($)</th>
      <th>Difference (%)</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="budgetBody">
    <tr draggable="true">
      <td><input type="text" placeholder="Category"></td>
      <td><input type="number" value="0" class="approved"></td>
      <td><input type="number" value="0" class="proposed"></td>
      <td><input type="number" value="0" class="diff" readonly></td>
      <td><input type="number" value="0" class="diffPercent" readonly></td>
      <td><button onclick="removeRow(this)">Remove</button></td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td>Total</td>
      <td id="totalApproved">0</td>
      <td id="totalProposed">0</td>
      <td id="totalDiff">0</td>
      <td id="totalDiffPercent">0%</td>
      <td></td>
    </tr>
  </tfoot>
</table>

<canvas id="budgetChart" height="200"></canvas>
<div class="toast" id="toast"></div>

<script>
let isDark=true;

function goHome(){
  window.location.href = 'index.html'; // change this URL to your dashboard path
}

function toggleTheme(){
  isDark = !isDark;
  document.body.style.background = isDark ? 'var(--bg-color-dark)' : 'var(--bg-color-light)';
  document.body.style.color = isDark ? 'var(--text-color-dark)' : 'var(--text-color-light)';
  document.querySelectorAll('table').forEach(t=>{
    t.style.background = isDark ? 'var(--table-bg-dark)' : 'var(--table-bg-light)';
  });
  document.querySelectorAll('th').forEach(th=>{
    th.style.background = 'var(--header-bg-dark)';
  });
  document.querySelectorAll('input').forEach(inp=>{
    inp.style.background = isDark ? 'var(--bg-color-dark)' : 'var(--bg-color-light)';
    inp.style.color = isDark ? 'var(--text-color-dark)' : 'var(--text-color-light)';
  });
  document.querySelector('canvas').style.background = isDark ? 'var(--table-bg-dark)' : 'var(--table-bg-light)';
}

function showToast(msg,d=3000){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),d);
}

function calculateRow(row){
  const approved = parseFloat(row.querySelector('.approved').value) || 0;
  const proposed = parseFloat(row.querySelector('.proposed').value) || 0;
  const diff = proposed - approved;
  const diffPercent = approved ? ((diff/approved)*100).toFixed(2) : 0;
  const diffInput = row.querySelector('.diff');
  const diffPercentInput = row.querySelector('.diffPercent');
  diffInput.value = diff;
  diffPercentInput.value = diffPercent;
  diffInput.style.color = diff>=0?'#22c55e':'#ef4444';
  updateTotals();
  updateChart();
}

function addRow(){
  const tbody = document.getElementById('budgetBody');
  const tr = document.createElement('tr');
  tr.setAttribute('draggable','true');
  tr.innerHTML = `
    <td><input type="text" placeholder="Category"></td>
    <td><input type="number" value="0" class="approved"></td>
    <td><input type="number" value="0" class="proposed"></td>
    <td><input type="number" value="0" class="diff" readonly></td>
    <td><input type="number" value="0" class="diffPercent" readonly></td>
    <td><button onclick="removeRow(this)">Remove</button></td>
  `;
  tbody.appendChild(tr);
  tr.querySelectorAll('.approved, .proposed').forEach(input=>{
    input.addEventListener('input',()=>calculateRow(tr));
  });
  addDragEvents(tr);
}

function removeRow(btn){
  btn.closest('tr').remove();
  updateTotals();
  updateChart();
}

document.querySelectorAll('.approved, .proposed').forEach(input=>{
  input.addEventListener('input', e=>calculateRow(e.target.closest('tr')));
});

function updateTotals(){
  let totalApproved=0, totalProposed=0;
  document.querySelectorAll('#budgetBody tr').forEach(row=>{
    totalApproved += parseFloat(row.querySelector('.approved').value) || 0;
    totalProposed += parseFloat(row.querySelector('.proposed').value) || 0;
  });
  const diff = totalProposed - totalApproved;
  const diffPercent = totalApproved ? ((diff/totalApproved)*100).toFixed(2) : 0;
  document.getElementById('totalApproved').textContent = totalApproved;
  document.getElementById('totalProposed').textContent = totalProposed;
  document.getElementById('totalDiff').textContent = diff;
  document.getElementById('totalDiffPercent').textContent = diffPercent+'%';
}

async function saveBudget(){
  const rows = document.querySelectorAll('#budgetBody tr');
  const data=[];
  rows.forEach(row=>{
    const category = row.querySelector('td:nth-child(1) input').value;
    const approved = parseFloat(row.querySelector('.approved').value) || 0;
    const proposed = parseFloat(row.querySelector('.proposed').value) || 0;
    const diff = parseFloat(row.querySelector('.diff').value) || 0;
    const diffPercent = parseFloat(row.querySelector('.diffPercent').value) || 0;
    if(category) data.push({category, approved, proposed, diff, diffPercent});
  });
  try{
    await fetch('api/save_budget_table.php',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rows:data})
    });
    showToast('Budget saved successfully!');
  }catch(err){ console.error(err); showToast('Failed to save budget'); }
}

function printTable(){
  let printContent = document.getElementById('budgetTable').outerHTML;
  let w = window.open();
  w.document.write('<html><head><title>Budget Report</title></head><body>'+printContent+'</body></html>');
  w.document.close();
  w.print();
}

function exportExcel(){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.table_to_sheet(document.getElementById('budgetTable'));
  XLSX.utils.book_append_sheet(wb, ws, "Budget");
  XLSX.writeFile(wb, "Budget_Report.xlsx");
}

let budgetChart;
function updateChart(){
  const categories = [];
  const approvedValues = [];
  const proposedValues = [];
  document.querySelectorAll('#budgetBody tr').forEach(row=>{
    const cat = row.querySelector('td:nth-child(1) input').value;
    if(cat){
      categories.push(cat);
      approvedValues.push(parseFloat(row.querySelector('.approved').value)||0);
      proposedValues.push(parseFloat(row.querySelector('.proposed').value)||0);
    }
  });
  if(budgetChart) budgetChart.destroy();
  const ctx = document.getElementById('budgetChart').getContext('2d');
  budgetChart = new Chart(ctx,{
    type:'bar',
    data:{
      labels:categories,
      datasets:[
        { label:'Approved', data:approvedValues, backgroundColor:'#3b82f6' },
        { label:'Proposed', data:proposedValues, backgroundColor:'#22c55e' }
      ]
    },
    options:{ responsive:true, plugins:{ legend:{ labels:{color:isDark?'#f1f5f9':'#1f2937'} } }, scales:{ x:{ ticks:{color:isDark?'#f1f5f9':'#1f2937'} }, y:{ ticks:{color:isDark?'#f1f5f9':'#1f2937'} } } }
  });
}

// Drag and Drop
let dragSrcEl=null;
function addDragEvents(row){
  row.addEventListener('dragstart', e=>{
    dragSrcEl = row;
    row.classList.add('dragging');
  });
  row.addEventListener('dragend', e=>{
    row.classList.remove('dragging');
  });
  row.addEventListener('dragover', e=>{ e.preventDefault(); });
  row.addEventListener('drop', e=>{
    e.preventDefault();
    if(dragSrcEl && dragSrcEl!==row){
      const tbody = row.parentNode;
      const nodes = Array.from(tbody.children);
      const srcIndex = nodes.indexOf(dragSrcEl);
      const targetIndex = nodes.indexOf(row);
      if(srcIndex<targetIndex){ tbody.insertBefore(dragSrcEl,row.nextSibling); }
      else{ tbody.insertBefore(dragSrcEl,row); }
      updateChart();
    }
  });
}
document.querySelectorAll('#budgetBody tr').forEach(tr=>addDragEvents(tr));

// Preset Templates
const templates = {
  basic: [
    {category:'Salaries', approved:5000, proposed:5200},
    {category:'Utilities', approved:800, proposed:900},
    {category:'Office Supplies', approved:300, proposed:350}
  ],
  marketing: [
    {category:'Social Media', approved:1000, proposed:1200},
    {category:'Campaigns', approved:2000, proposed:2500},
    {category:'Promotions', approved:1500, proposed:1800}
  ],
  full: [
    {category:'Salaries', approved:5000, proposed:5200},
    {category:'Utilities', approved:800, proposed:900},
    {category:'Office Supplies', approved:300, proposed:350},
    {category:'Marketing', approved:4500, proposed:5000},
    {category:'Travel', approved:1200, proposed:1500}
  ]
};

function loadTemplate(){
  const val = document.getElementById('presetTemplates').value;
  if(!val) return;
  const tbody = document.getElementById('budgetBody');
  tbody.innerHTML = '';
  templates[val].forEach(item=>{
    const tr = document.createElement('tr');
    tr.setAttribute('draggable','true');
    tr.innerHTML = `
      <td><input type="text" value="${item.category}"></td>
      <td><input type="number" value="${item.approved}" class="approved"></td>
      <td><input type="number" value="${item.proposed}" class="proposed"></td>
      <td><input type="number" value="0" class="diff" readonly></td>
      <td><input type="number" value="0" class="diffPercent" readonly></td>
      <td><button onclick="removeRow(this)">Remove</button></td>
    `;
    tbody.appendChild(tr);
    tr.querySelectorAll('.approved, .proposed').forEach(input=>input.addEventListener('input',()=>calculateRow(tr)));
    addDragEvents(tr);
    calculateRow(tr);
  });
}
updateChart();
</script>
</body>
</html>
